# M4 + data consistency: the seed-0 diffusion networks sampled with DC (eta = 0.5, chosen on validation
# patients: logs/m4_dc_pilot.log, LOG.md) on the MRI and inpainting tasks. Nothing is retrained.
profile: full
out_name: m4_dc
data:
  name: msd
  path: data/processed/msd_t2_128.npz
ood:
- name: ixi
  path: data/processed/ixi_t2_128.npz
  tag: ixi
ood_dseeds:
- 0
methods:
  diffusion:
  - 0
train:
  base: 16
  batch: 16
  lr: 0.0005
  steps: 4000
  eval_every: 500
  n_val: 32
  eval_batch: 32
train_overrides:
  diffusion:
    steps: 30000
    eval_every: 2500
    val_steps: 20
    n_samples: 8
    sample_steps: 25
    sample_batch: 64
    dc_eta: 0.5
    plain: false
  gan:
    lr_d: 0.0002
    gan_l1: 100.0
eval_dseeds:
- 0
- 1
- 2
tasks:
  mri_R2:
    type: mri
    R: 2
    mask: mixed
    sigma: 0.02
  mri_R4:
    type: mri
    R: 4
    mask: mixed
    sigma: 0.02
  mri_R8:
    type: mri
    R: 8
    mask: mixed
    sigma: 0.02
  inpaint_mixed:
    type: inpaint
    mask: mixed
    sigma: 0.01
