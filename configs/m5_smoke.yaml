# M5 smoke: CPU, the smoke phantoms and the smoke M2/M3/M4 checkpoints. Checks the pipeline, not the numbers.
profile: smoke
cpu: true
data: {name: phantom, n_images: 60, size: 64, seed: 1234, max_slices: {test: 12}}
tasks:
  denoise_s0.06: {type: denoise, sigma: 0.06}
  mri_R4: {type: mri, R: 4, mask: mixed, sigma: 0.02}
  inpaint_mixed: {type: inpaint, mask: mixed, sigma: 0.01}
classical: {denoise: [bm3d], mri: [tv], inpaint: [biharmonic]}
nets: [configs/m3_smoke.yaml, configs/m4_smoke.yaml]
eval_dseeds: [0]
eval_batch: 16
