# Full profile, classical baselines (M2): 4 noise levels, R in {2,4,8}, mixed inpainting masks.
profile: full
data: {name: msd, path: data/processed/msd_t2_128.npz}
ood:
  - {name: ixi, path: data/processed/ixi_t2_128.npz, tag: ixi}
seeds: [0, 1, 2]
# one seed on IXI: classical methods are not trained, so OOD only tests whether tuned weights transfer;
# 3 seeds would add ~2.5 h of BM3D on ~960 IXI slices
ood_seeds: [0]
tune_val_slices: 32
tasks:
  denoise_s0.03: {type: denoise, sigma: 0.03}
  denoise_s0.06: {type: denoise, sigma: 0.06}
  denoise_s0.10: {type: denoise, sigma: 0.10}
  denoise_s0.15: {type: denoise, sigma: 0.15}
  mri_R2: {type: mri, R: 2, mask: mixed, sigma: 0.02}
  mri_R4: {type: mri, R: 4, mask: mixed, sigma: 0.02}
  mri_R8: {type: mri, R: 8, mask: mixed, sigma: 0.02}
  inpaint_mixed: {type: inpaint, mask: mixed, sigma: 0.01}
